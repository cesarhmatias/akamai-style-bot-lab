name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_results:
        description: "Commit the regenerated RESULTS.md back to main (main only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev,clients]'
      - run: ruff check .
      - run: mypy

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev,clients]'
      - name: pytest with coverage (fail_under from pyproject.toml)
        run: pytest --cov --cov-report=xml --cov-report=term-missing
      - name: Coverage in job summary
        if: always()
        run: |
          if [ -f coverage.xml ]; then
            python - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import xml.etree.ElementTree as ET
          rate = float(ET.parse("coverage.xml").getroot().get("line-rate", 0)) * 100
          print(f"### Python coverage: {rate:.2f}%")
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
      - uses: actions/setup-go@v5
        with:
          go-version-file: edge/go.mod
          cache-dependency-path: edge/go.sum
      - name: Go tests (edge)
        working-directory: edge
        run: |
          go vet ./...
          go test ./...

  matrix:
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WANT_COMMIT: ${{ inputs.commit_results == true || vars.COMMIT_RESULTS == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[clients]'
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(python -c 'from importlib.metadata import version; print(version("playwright"))')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium
      - name: Install Chromium system deps only (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium
      - name: Start the lab (waits for healthchecks)
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Run client matrix (fails on drift from clients/expected_matrix.json)
        run: python -m clients.run_matrix
      # Only the "## Matrix" section is compared. The rest of RESULTS.md embeds the observed JA4 of
      # every client (it depends on the Chromium build and on the runner's OpenSSL) and the signal
      # reasons, so a byte diff of the whole file would fail for reasons unrelated to the matrix.
      # The cells themselves are already gated by clients/expected_matrix.json in the step above;
      # this step catches a committed RESULTS.md that is stale.
      - name: Matrix section of RESULTS.md must match the committed one
        if: env.WANT_COMMIT != 'true'
        run: |
          python - <<'PY'
          import difflib
          import subprocess
          import sys


          def matrix(text):
              rows, on = [], False
              for line in text.splitlines():
                  if line.startswith("## "):
                      on = line.strip() == "## Matrix"
                  elif on:
                      rows.append(line)
              return rows


          committed = subprocess.run(
              ["git", "show", "HEAD:RESULTS.md"], capture_output=True, text=True, check=True
          ).stdout
          with open("RESULTS.md", encoding="utf-8") as fh:
              current = fh.read()
          want, got = matrix(committed), matrix(current)
          if not got:
              sys.exit("no '## Matrix' section in the regenerated RESULTS.md")
          if want != got:
              sys.stdout.writelines(
                  line + "\n"
                  for line in difflib.unified_diff(want, got, "committed", "regenerated", lineterm="")
              )
              sys.exit("RESULTS.md matrix section is stale: regenerate it and commit")
          print("RESULTS.md matrix section matches the committed one")
          PY
      - name: Collect container logs
        if: always()
        run: docker compose logs --no-color > compose.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matrix-results
          path: |
            RESULTS.md
            results.json
            compose.log
          if-no-files-found: warn
      - name: Tear down
        if: always()
        run: docker compose down -v

  commit-results:
    # Opt-in: workflow_dispatch with commit_results=true, or repo variable COMMIT_RESULTS=true.
    needs: matrix
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      (inputs.commit_results == true || vars.COMMIT_RESULTS == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: matrix-results
          path: matrix-results
      - name: Commit RESULTS.md if it changed
        run: |
          cp matrix-results/RESULTS.md RESULTS.md
          if git diff --quiet RESULTS.md; then
            echo "RESULTS.md unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RESULTS.md
          git commit -m "docs: refresh RESULTS.md from CI [skip ci]"
          git push
