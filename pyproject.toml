[project]
name = "akamai-style-bot-lab"
version = "0.1.0"
description = "Self-hosted playground that simulates Akamai-style bot-detection techniques."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "redis>=5.0",
  "sse-starlette>=2.1",
]

[project.optional-dependencies]
# Exact pins on purpose: the harness's observed fingerprints (the Playwright JA4 depends on the Chromium
# build that ships with playwright, the naive client's User-Agent on requests) must not move between
# installs. Bump them together with clients/expected_matrix.json and RESULTS.md.
clients = ["requests==2.34.2", "curl_cffi==0.16.3", "playwright==1.63.0"]
dev = [
  "pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "httpx>=0.27",
  "ruff>=0.6", "mypy>=1.11", "types-requests",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["dashboard/dev"]  # throwaway stdlib mock, not lab code

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = false
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
files = ["api/app", "clients"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["api/tests"]
pythonpath = ["api"]

[tool.coverage.run]
source = ["api/app"]
omit = ["api/app/main.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Not a distributable package: the install only pulls dependencies.
# Code is imported via pythonpath (api/) and `python -m clients.*` from the repo root.
packages = []
